<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 启用沉浸式全屏，解决顶部白边，加入 viewport-fit=cover -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="碎块寻数">
    <meta name="theme-color" content="#000000">
    
    <!-- 精心设计的 SVG 桌面图标：晶体风格的 '1' -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='%23000000'/><path d='M110 60 L140 50 L160 70 L140 200 L110 190 Z' fill='url(%23grad)' stroke='%23ffffff' stroke-width='4' stroke-linejoin='round'/><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8' /><stop offset='100%' stop-color='%233b82f6' /></linearGradient></defs></svg>">
    
    <title>碎块寻数 - 全息材质狂热版</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 动态环境背景变量 */
            --bg-start: #1a1025;
            --bg-mid: #0f0a1c;
            --bg-end: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }

        #bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            transition: background 1.5s ease-in-out;
            z-index: 1;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #dynamic-island-ui {
            position: absolute;
            /* 智能跟随系统安全区，形成真正的悬浮胶囊 */
            top: max(env(safe-area-inset-top), 15px);
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            border-radius: 999px; /* 完美的圆润胶囊形状 */
            z-index: 50;
            display: flex;
            flex-direction: column;
            width: auto;
            min-width: 280px;
            padding: 10px 24px;
            /* 增加高光内发光，模拟真机玻璃质感 */
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
        }

        #dynamic-island-ui.hidden {
            transform: translate(-50%, -100%) scale(0.8);
            opacity: 0;
        }

        .island-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .island-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .island-label {
            font-size: 0.55rem;
            color: #888;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .island-value {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
        }

        .island-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* 目标数字发光环 */
        .target-ring {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: transform 0.1s ease;
        }

        #target-display {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        /* 灵动岛呼吸膨胀动画 */
        .island-pop {
            animation: islandPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes islandPop {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.06); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* 倒计时进度条 */
        #time-bar-container {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }

        #time-bar {
            height: 100%;
            background-color: #fff;
            width: 100%;
            transform-origin: left;
            transition: width 0.1s linear, background-color 0.3s;
        }

        #canvas-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: opacity 0.4s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 高级按钮质感 */
        .btn {
            background: linear-gradient(135deg, #ffffff, #d1d5db);
            color: #000;
            padding: 16px 56px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 30px rgba(255,255,255,0.2), inset 0 -4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        /* 震动动画 */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 3px); }
            50% { transform: translate(6px, -3px); }
            75% { transform: translate(-6px, -3px); }
        }
        .shake-anim {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>

<!-- 动态背景层 -->
<div id="bg-layer"></div>

<div id="game-container">
    <!-- 全新：原生级灵动岛融合悬浮胶囊 -->
    <div id="dynamic-island-ui" class="hidden">
        <div class="island-content">
            <div class="island-side">
                <span class="island-label">LEVEL</span>
                <span id="level-display" class="island-value">1</span>
            </div>
            
            <div class="island-center">
                <div class="target-ring" id="target-ring">
                    <span id="target-display">1</span>
                </div>
            </div>
            
            <div class="island-side" style="align-items: flex-end;">
                <span class="island-label">TIME</span>
                <span id="timer-display" class="island-value">15s</span>
            </div>
        </div>
        
        <div id="time-bar-container">
            <div id="time-bar"></div>
        </div>
        
        <!-- 连击提示移至胶囊外部下方，保持胶囊几何美感 -->
        <div class="absolute -bottom-8 w-full flex justify-center pointer-events-none">
            <span id="combo-display" class="hidden text-base font-black italic tracking-wider drop-shadow-lg transition-all duration-300"></span>
        </div>
    </div>

    <!-- 游戏主画布 -->
    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 菜单与结算蒙版 -->
        <div id="overlay">
            <h1 id="menu-title" class="text-5xl font-extrabold mb-4 text-white tracking-tight drop-shadow-[0_0_30px_rgba(255,255,255,0.5)]">碎块寻数</h1>
            <p id="menu-subtitle" class="text-gray-400 mb-10 font-bold tracking-wide">按数字大小顺序，依次找出它们</p>
            
            <div id="stats" class="hidden mb-10 w-64 bg-white/10 backdrop-blur-lg border border-white/20 p-6 rounded-3xl flex flex-col items-center shadow-2xl">
                <p id="stats-label" class="text-gray-400 text-sm uppercase tracking-widest mb-2">通关耗时</p>
                <p id="stats-value" class="text-5xl text-white font-black drop-shadow-md">0</p>
            </div>

            <button class="btn" id="start-btn">PLAY</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    const bgLayer = document.getElementById('bg-layer');
    
    // UI Elements
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const uiLayer = document.getElementById('dynamic-island-ui');
    const levelDisplay = document.getElementById('level-display');
    const targetDisplay = document.getElementById('target-display');
    const timerDisplay = document.getElementById('timer-display');
    const timeBar = document.getElementById('time-bar');
    const comboDisplay = document.getElementById('combo-display');
    const islandGlow = document.getElementById('island-glow');
    const themeNameDisplay = document.getElementById('theme-name-display');
    
    const menuTitle = document.getElementById('menu-title');
    const menuSubtitle = document.getElementById('menu-subtitle');
    const statsDiv = document.getElementById('stats');
    const statsLabel = document.getElementById('stats-label');
    const statsValue = document.getElementById('stats-value');
    const rootStyle = document.documentElement.style;

    // 游戏核心状态
    let gameState = 'START';
    let currentLevel = 1;
    let expectedNumber = 1;
    let totalNumbers = 9;
    let polygons = [];
    let particles = [];
    let floatingTexts = [];
    
    // 时间与连击变量
    let maxTime = 0;
    let timeLeft = 0;
    let lastFrameTime = 0;
    let animationFrameId;
    let levelStartTime = 0;
    let totalTimeTaken = 0;
    
    let comboCount = 0;
    let lastClickTime = 0;
    const COMBO_TIMEOUT = 1800; // 1.8秒内点击维持连击

    const THEMES = [
        {
            id: 'glass', name: '晶钻琉璃',
            bgStart: '#1a1025', bgMid: '#0f0a1c', bgEnd: '#000000',
            colors: [
                {s: '#a855f7', e: '#c084fc'}, {s: '#3b82f6', e: '#60a5fa'}, 
                {s: '#ec4899', e: '#f472b6'}, {s: '#14b8a6', e: '#2dd4bf'}
            ]
        },
        {
            id: 'metal', name: '重工金属',
            bgStart: '#27272a', bgMid: '#18181b', bgEnd: '#000000',
            colors: [
                {s: '#f59e0b', e: '#fbbf24'}, {s: '#64748b', e: '#94a3b8'}, 
                {s: '#b91c1c', e: '#ef4444'}, {s: '#4338ca', e: '#6366f1'}
            ]
        },
        {
            id: 'jelly', name: 'Q弹果冻',
            bgStart: '#4a044e', bgMid: '#2e1065', bgEnd: '#0f172a',
            colors: [
                {s: '#f43f5e', e: '#fb7185'}, {s: '#8b5cf6', e: '#a78bfa'},
                {s: '#0ea5e9', e: '#38bdf8'}, {s: '#10b981', e: '#34d399'}
            ]
        },
        {
            id: 'ice', name: '极寒冰晶',
            bgStart: '#082f49', bgMid: '#0f172a', bgEnd: '#000000',
            colors: [
                {s: '#0284c7', e: '#38bdf8'}, {s: '#0d9488', e: '#2dd4bf'},
                {s: '#2563eb', e: '#60a5fa'}, {s: '#0891b2', e: '#22d3ee'}
            ]
        },
        {
            id: 'plush', name: '温暖毛绒',
            bgStart: '#451a03', bgMid: '#1c1917', bgEnd: '#000000',
            colors: [
                {s: '#d97706', e: '#fcd34d'}, {s: '#ea580c', e: '#fdba74'},
                {s: '#65a30d', e: '#bef264'}, {s: '#db2777', e: '#f9a8d4'}
            ]
        }
    ];
    let currentTheme = THEMES[0];

    function applyTheme(theme) {
        currentTheme = theme;
        rootStyle.setProperty('--bg-start', theme.bgStart);
        rootStyle.setProperty('--bg-mid', theme.bgMid);
        rootStyle.setProperty('--bg-end', theme.bgEnd);
        
        const mainColor = theme.colors[0].s;
        
        // 兼容遗留的文字DOM，防止报错
        if(themeNameDisplay) {
            themeNameDisplay.innerText = theme.name;
            themeNameDisplay.style.color = mainColor;
        }
        if(islandGlow) {
            islandGlow.style.background = mainColor;
            islandGlow.style.boxShadow = `0 0 20px 4px ${mainColor}`;
        }
        
        // 更新胶囊目标环的高级氛围色
        const targetRing = document.getElementById('target-ring');
        if (targetRing) {
            targetRing.style.borderColor = mainColor;
            targetRing.style.boxShadow = `0 0 15px ${mainColor}`;
        }
        
        timeBar.style.backgroundColor = mainColor;
    }

    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
            // 根据材质微调音效
            if(currentTheme.id === 'glass' || currentTheme.id === 'ice') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now); osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
            } else if (currentTheme.id === 'metal') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
            } else if (currentTheme.id === 'jelly') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
            } else {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            }
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
            gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'fever') {
            // 狂热连击音效
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'levelUp') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.linearRampToValueAtTime(880, now + 0.2);
            gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.1); gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    let width, height;
    function resizeCanvas() {
        const newWidth = wrapper.clientWidth;
        const newHeight = wrapper.clientHeight;
        // 忽略没有实际变化的触发
        if (width === newWidth && height === newHeight) return;
        
        const oldWidth = width;
        const oldHeight = height;
        width = newWidth;
        height = newHeight;
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        // 修复 1：响应屏幕尺寸变化（如手机地址栏隐藏）时，同步按比例缩放已生成的碎块坐标，防止错位
        if ((gameState === 'PLAYING' || gameState === 'TRANSITION') && oldWidth && oldHeight) {
            const scaleX = width / oldWidth;
            const scaleY = height / oldHeight;
            polygons.forEach(p => {
                p.center.x *= scaleX;
                p.center.y *= scaleY;
                p.points.forEach(pt => {
                    pt.x *= scaleX;
                    pt.y *= scaleY;
                });
                p.bbox.minX *= scaleX; p.bbox.minY *= scaleY;
                p.bbox.maxX *= scaleX; p.bbox.maxY *= scaleY;
            });
        }
    }
    
    // 加入防抖机制，避免移动端滚动时频繁触发重绘
    window.addEventListener('resize', () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(resizeCanvas, 100);
    });

    function generatePolygons(count) {
        // 修复 3：防遮挡布局计算。避开顶部灵动岛，同时增加安全高度钳制，防止极端宽高比下算法崩溃
        let safeTop = Math.max(160, height * 0.2); 
        const margin = 10;
        if (safeTop >= height - margin * 2) safeTop = height / 2;
        
        let points = Array.from({length: count}, () => [
            margin + Math.random() * (width - margin * 2),
            safeTop + margin + Math.random() * (height - safeTop - margin * 2)
        ]);

        // Lloyd 劳埃德松弛算法，使点位分布均匀
        const relaxIterations = 4;
        let delaunay, voronoi;
        for (let iter = 0; iter < relaxIterations; iter++) {
            delaunay = d3.Delaunay.from(points);
            voronoi = delaunay.voronoi([margin, safeTop, width-margin, height-margin]);
            for (let i = 0; i < count; i++) {
                const polygon = voronoi.cellPolygon(i);
                if (polygon) points[i] = d3.polygonCentroid(polygon);
            }
        }

        delaunay = d3.Delaunay.from(points);
        voronoi = delaunay.voronoi([0, 0, width, height]); // 最终边界可以全屏，让碎块边缘自然延伸
        
        let numbers = Array.from({length: count}, (_, i) => i + 1);
        
        // 修复 4：使用 Fisher-Yates 洗牌算法，彻底解决 sort 随机打乱分布不均匀的问题
        for (let i = numbers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }

        polygons = [];
        for (let i = 0; i < count; i++) {
            let rawPolygon = voronoi.cellPolygon(i);
            if (!rawPolygon) continue;
            rawPolygon.pop(); 
            
            const centroid = d3.polygonCentroid(rawPolygon);
            const centerPt = { x: centroid[0], y: centroid[1] };
            
            // 缝隙收缩
            const gapSize = 5; 
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            
            const shrunkenPoints = rawPolygon.map(p => {
                const pt = {x: p[0], y: p[1]};
                const dx = pt.x - centerPt.x;
                const dy = pt.y - centerPt.y;
                const len = Math.hypot(dx, dy);
                
                let nx = pt.x, ny = pt.y;
                if (len > gapSize) {
                    nx = pt.x - (dx / len) * gapSize;
                    ny = pt.y - (dy / len) * gapSize;
                }
                minX = Math.min(minX, nx); minY = Math.min(minY, ny);
                maxX = Math.max(maxX, nx); maxY = Math.max(maxY, ny);
                return {x: nx, y: ny};
            });

            const colorObj = currentTheme.colors[Math.floor(Math.random() * currentTheme.colors.length)];
            const distFromCenter = Math.hypot(centerPt.x - width/2, centerPt.y - height/2);

            polygons.push({
                id: i, number: numbers[i], points: shrunkenPoints, center: centerPt,
                bbox: {minX, minY, maxX, maxY},
                baseColor: colorObj,
                state: 'normal', scale: 0, alpha: 0,
                floatOffset: Math.random() * Math.PI * 2, // 独立悬浮动画相位
                spawnDelay: (distFromCenter / (width/2)) * 300 + Math.random() * 150
            });
        }
    }

    function isPointInPolygon(pt, vs) {
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i].x, yi = vs[i].y;
            let xj = vs[j].x, yj = vs[j].y;
            let intersect = ((yi > pt.y) != (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    function spawnParticles(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                life: 1, color: color,
                size: Math.random() * 6 + 3
            });
        }
    }

    function spawnFloatingText(text, x, y, color, isBig = false) {
        floatingTexts.push({
            text: text, x: x, y: y, color: color,
            life: 1, isBig: isBig,
            vy: -2
        });
    }

    function updateTargetUI() {
        targetDisplay.innerText = expectedNumber;
        
        // 触发整个灵动岛的“膨胀-回弹”物理震颤效果
        uiLayer.classList.remove('island-pop');
        void uiLayer.offsetWidth; // 触发重绘
        uiLayer.classList.add('island-pop');
        
        const targetRing = document.getElementById('target-ring');
        if (targetRing) {
            targetRing.style.transform = 'scale(1.2)';
            setTimeout(() => targetRing.style.transform = 'scale(1)', 150);
        }
    }

    function updateTimerUI() {
        timerDisplay.innerText = `${Math.ceil(timeLeft)}s`;
        const percent = Math.max(0, (timeLeft / maxTime) * 100);
        timeBar.style.width = `${percent}%`;
        
        if (percent < 25) {
            timeBar.style.backgroundColor = '#ef4444';
            timerDisplay.classList.add('text-red-500');
        } else {
            timeBar.style.backgroundColor = currentTheme.colors[0].s;
            timerDisplay.classList.remove('text-red-500');
        }
    }

    function draw() {
        // 核心修复：统一使用 Date.now()，解决与页面高精度时间戳的冲突导致计算出负数的问题
        const now = Date.now();
        ctx.clearRect(0, 0, width, height);

        if (gameState !== 'PLAYING' && gameState !== 'TRANSITION') return;

        const timeSinceStart = now - levelStartTime;
        const avgArea = (width * height) / totalNumbers;
        const fontSize = Math.max(16, Math.sqrt(avgArea) * 0.4);

        // 修复 2：仅在 PLAYING 状态下处理动画和渲染，避免过场动画时碎块乱闪与坐标乱窜
        if (gameState === 'PLAYING') {
            // 渲染碎块
            polygons.forEach(p => {
                if (timeSinceStart < p.spawnDelay) return;

                ctx.save();
                
                // 物理悬浮与弹性动画
                let yOffset = 0;
                if (p.state === 'clicked') {
                    p.scale += (1.2 - p.scale) * 0.2; // 点击后略微放大
                    p.alpha += (0 - p.alpha) * 0.15; // 点击后渐渐消失
                } else if (p.state === 'error') {
                    p.scale = 1; p.alpha = 1;
                    // 修复报错状态无法复原的截断问题
                    if (now - p.errorStartTime > 300) p.state = 'normal';
                } else {
                    p.scale += (1 - p.scale) * 0.15;
                    p.alpha += (1 - p.alpha) * 0.15;
                    // 独立悬浮呼吸
                    yOffset = Math.sin(now * 0.003 + p.floatOffset) * 3;
                }

                if (p.alpha <= 0.01) { ctx.restore(); return; }

                ctx.globalAlpha = p.alpha;
                ctx.translate(p.center.x, p.center.y + yOffset);
                ctx.scale(p.scale, p.scale);
                ctx.translate(-p.center.x, -p.center.y);

                // 绘制形状路径
                ctx.beginPath();
                if (p.points && p.points.length > 0) {
                    ctx.moveTo(p.points[0].x, p.points[0].y);
                    for (let j = 1; j < p.points.length; j++) {
                        ctx.lineTo(p.points[j].x, p.points[j].y);
                    }
                }
                ctx.closePath();

            // 材质渲染器
            if (p.state === 'error') {
                ctx.fillStyle = '#ef4444'; 
                ctx.fill();
            } else {
                const grad = ctx.createLinearGradient(p.bbox.minX, p.bbox.minY, p.bbox.maxX, p.bbox.maxY);
                
                if (currentTheme.id === 'glass') {
                    grad.addColorStop(0, p.baseColor.s);
                    grad.addColorStop(0.6, p.baseColor.e);
                    grad.addColorStop(1, '#ffffff'); // 底部折射
                    ctx.fillStyle = grad;
                    // 真实悬浮阴影
                    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 15;
                    ctx.fill(); ctx.shadowBlur = 0;
                    
                    // 内部高光面
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.moveTo(p.points[0].x, p.points[0].y); ctx.lineTo(p.center.x, p.center.y);
                    ctx.lineTo(p.points[1%p.points.length].x, p.points[1%p.points.length].y);
                    ctx.fill();
                    
                    ctx.lineJoin = "bevel"; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
                } 
                else if (currentTheme.id === 'metal') {
                    const shift = Math.sin(now * 0.001 + p.id) * 0.1;
                    grad.addColorStop(0, '#f1f5f9');
                    grad.addColorStop(0.4+shift, '#94a3b8');
                    grad.addColorStop(0.45+shift, '#0f172a'); // 深渊倒影
                    grad.addColorStop(1, p.baseColor.e); 
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 10;
                    ctx.fill(); ctx.shadowBlur = 0;
                    
                    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
                    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.stroke();
                }
                else if (currentTheme.id === 'jelly') {
                    const rGrad = ctx.createRadialGradient(p.center.x, p.center.y, 0, p.center.x, p.center.y, Math.max(p.bbox.maxX-p.bbox.minX, 10));
                    rGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
                    rGrad.addColorStop(0.3, p.baseColor.s);
                    rGrad.addColorStop(1, p.baseColor.e);
                    ctx.fillStyle = rGrad;
                    ctx.shadowColor = p.baseColor.s; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
                    ctx.fill(); ctx.shadowBlur = 0;
                    
                    // 月牙高光
                    ctx.save();
                    ctx.clip(); 
                    ctx.beginPath();
                    const hRad = (p.bbox.maxX-p.bbox.minX)*0.4;
                    ctx.arc(p.bbox.minX + hRad, p.bbox.minY + hRad, hRad, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
                    ctx.restore();
                }
                else if (currentTheme.id === 'ice') {
                    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    grad.addColorStop(0.4, p.baseColor.s);
                    grad.addColorStop(1, p.baseColor.e);
                    ctx.fillStyle = grad;
                    ctx.shadowColor = p.baseColor.s; ctx.shadowBlur = 15;
                    ctx.fill(); ctx.shadowBlur = 0;
                    
                    // 冰裂纹
                    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    p.points.forEach((pt, i) => { if(i%2===0) { ctx.moveTo(p.center.x, p.center.y); ctx.lineTo(pt.x, pt.y); }});
                    ctx.stroke();
                    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                }
                else if (currentTheme.id === 'plush') {
                    const pGrad = ctx.createRadialGradient(p.center.x, p.center.y, 0, p.center.x, p.center.y, Math.max(p.bbox.maxX-p.bbox.minX, 15));
                    pGrad.addColorStop(0, p.baseColor.s);
                    pGrad.addColorStop(1, p.baseColor.e);
                    ctx.fillStyle = pGrad;
                    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 10;
                    ctx.fill(); ctx.shadowBlur = 0;
                    
                    // 缝合线
                    ctx.save(); ctx.clip();
                    ctx.setLineDash([6, 5]); ctx.lineJoin = "round"; ctx.lineWidth = 3; 
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.stroke(); 
                    ctx.translate(-1, -1); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.stroke(); 
                    ctx.restore();
                }
            }
                // 绘制文字 (统一白色带深邃阴影，无作弊高亮)
                if (p.state !== 'clicked') {
                    ctx.font = `900 ${fontSize}px 'Nunito', sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 2;
                    ctx.fillText(p.number, p.center.x, p.center.y);
                    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; // 重置阴影
                }

                ctx.restore();
            });

            // 渲染粒子
            particles.forEach((pt, i) => {
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03;
                if (pt.life <= 0) particles.splice(i, 1);
                else {
                    ctx.globalAlpha = pt.life;
                    ctx.fillStyle = pt.color;
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
                }
            });

            // 渲染飘字
            floatingTexts.forEach((ft, i) => {
                ft.y += ft.vy; ft.life -= 0.02;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
                else {
                    ctx.globalAlpha = ft.life;
                    ctx.font = `900 ${ft.isBig ? 40 : 24}px 'Nunito', sans-serif`;
                    ctx.fillStyle = ft.color;
                    ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.shadowBlur = 0;
                }
            });
            ctx.globalAlpha = 1;
        }

        if (gameState === 'TRANSITION') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            ctx.font = `900 ${width*0.12}px 'Nunito', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(`LEVEL ${currentLevel}`, width/2, height/2);
        }
    }

    function generateLevel(resetTime = true) {
        const bases = [9, 15, 24, 35, 45, 50, 60, 60]; 
        const times = [10, 16, 25, 36, 45, 50, 65, 60]; 
        
        const levelIdx = Math.min(currentLevel - 1, bases.length - 1);
        totalNumbers = bases[levelIdx];
        
        // 轮换材质主题
        applyTheme(THEMES[levelIdx % THEMES.length]);
        
        if (resetTime) {
            maxTime = times[levelIdx];
            timeLeft = maxTime;
        }
        
        expectedNumber = 1;
        comboCount = 0;
        updateComboUI();
        generatePolygons(totalNumbers);
        
        uiLayer.classList.remove('hidden');
        levelDisplay.innerText = currentLevel;
        updateTargetUI();
        
        gameState = 'TRANSITION';
        playSound('levelUp');
        
        setTimeout(() => {
            gameState = 'PLAYING';
            levelStartTime = Date.now();
        }, 1200);
    }

    function updateComboUI() {
        if (comboCount >= 2) {
            comboDisplay.innerText = `${comboCount} COMBO!`;
            comboDisplay.style.color = currentTheme.colors[0].s;
            comboDisplay.classList.remove('hidden');
            comboDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => comboDisplay.style.transform = 'scale(1)', 100);
        } else {
            comboDisplay.classList.add('hidden');
        }
    }

    function handleInteraction(e) {
        if (gameState !== 'PLAYING') return;
        initAudio(); 

        let clientX = e.clientX, clientY = e.clientY;
        if (e.type === 'touchstart') {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
        }

        const logicX = clientX; // 已经是绝对定位，直接使用视口坐标
        const logicY = clientY;
        const pt = { x: logicX, y: logicY };
        const now = Date.now();

        for (let i = polygons.length - 1; i >= 0; i--) {
            const p = polygons[i];
            if (p.state !== 'clicked' && p.scale > 0.5 && isPointInPolygon(pt, p.points)) {
                if (p.number === expectedNumber) {
                    p.state = 'clicked';
                    expectedNumber++;
                    playSound('click');
                    spawnParticles(p.center.x, p.center.y, p.baseColor.s);
                    
                    // 连击逻辑
                    if (now - lastClickTime < COMBO_TIMEOUT) {
                        comboCount++;
                        updateComboUI();
                        // FEVER 奖励
                        if (comboCount % 5 === 0) {
                            playSound('fever');
                            timeLeft = Math.min(maxTime, timeLeft + 3);
                            spawnFloatingText("FEVER! +3s", pt.x, pt.y - 40, '#fbbf24', true);
                            islandGlow.style.boxShadow = `0 0 40px 10px #fbbf24`;
                            setTimeout(()=> applyTheme(currentTheme), 500); // 恢复颜色
                        }
                    } else {
                        comboCount = 1;
                        updateComboUI();
                    }
                    lastClickTime = now;
                    
                    if (expectedNumber > totalNumbers) {
                        totalTimeTaken += (maxTime - Math.max(0, timeLeft));
                        setTimeout(() => {
                            currentLevel++;
                            if (currentLevel > 8) gameComplete(true);
                            else generateLevel();
                        }, 500);
                    } else {
                        updateTargetUI();
                    }
                } else {
                    if (p.state !== 'error') {
                        p.state = 'error';
                        p.errorStartTime = now;
                        comboCount = 0; updateComboUI();
                        playSound('error');
                        
                        timeLeft -= 2;
                        wrapper.classList.remove('shake-anim');
                        void wrapper.offsetWidth; 
                        wrapper.classList.add('shake-anim');
                        spawnFloatingText("-2s", pt.x, pt.y, '#ef4444');
                    }
                }
                break;
            }
        }
    }

    function gameComplete(isWin) {
        gameState = 'GAME_OVER';
        
        let btnText = "";
        if (isWin) {
            menuTitle.innerText = "MISSION CLEAR!";
            menuSubtitle.innerText = "惊人的眼力，你已征服所有幻境！";
            statsLabel.innerText = "总计耗时";
            statsValue.innerText = totalTimeTaken.toFixed(1) + "s";
            btnText = "PLAY AGAIN";
            playSound('levelUp');
        } else {
            menuTitle.innerText = "TIME'S UP!";
            menuSubtitle.innerText = "时间耗尽，注意力涣散了？";
            statsLabel.innerText = "止步关卡";
            statsValue.innerText = "Level " + currentLevel;
            btnText = "TRY AGAIN";
            playSound('error');
        }
        
        statsDiv.classList.remove('hidden');
        overlay.classList.remove('hidden');
        uiLayer.classList.add('hidden');

        startBtn.style.display = 'block';
        startBtn.style.pointerEvents = 'none';
        startBtn.style.opacity = '0.4';
        startBtn.innerText = btnText + " (1s)";
        
        setTimeout(() => {
            startBtn.style.pointerEvents = 'auto';
            startBtn.style.opacity = '1';
            startBtn.innerText = btnText;
        }, 1000);
    }

    function startGame() {
        initAudio();
        currentLevel = 1;
        totalTimeTaken = 0;
        overlay.classList.add('hidden');
        statsDiv.classList.add('hidden');
        startBtn.style.display = 'none'; 
        
        resizeCanvas();
        generateLevel(true);
    }

    canvas.addEventListener('mousedown', handleInteraction);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        handleInteraction(e);
    }, { passive: false });
    startBtn.addEventListener('click', startGame);
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function gameLoop(timestamp) {
        if (!lastFrameTime) lastFrameTime = timestamp;
        let delta = timestamp - lastFrameTime;
        lastFrameTime = timestamp;
        if (delta > 100) delta = 100;

        if (gameState === 'PLAYING' && expectedNumber <= totalNumbers) {
            timeLeft -= delta / 1000;
            // 连击槽衰减视觉提示
            if (Date.now() - lastClickTime > COMBO_TIMEOUT && comboCount > 0) {
                comboCount = 0; updateComboUI();
            }
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameComplete(false);
            }
            updateTimerUI();
        }

        // 调用时不再传递错误的底层 timestamp
        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
        resizeCanvas();
        gameLoop(0);
    };
</script>
</body>
